name: build-apk

on:
  push:
    branches: [ui-affectui-native]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No setup-android action: v3 installs the legacy 'tools' package, which no
      # longer exists in the SDK repository. ubuntu-latest runners ship an
      # Android SDK at $ANDROID_HOME already; just add the packages we need.
      - name: Install SDK packages (platform 37.2, build-tools)
        run: |
          SDKMANAGER="$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")"
          echo "sdkmanager: $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools"
          "$SDKMANAGER" "platforms;android-37.2" || "$SDKMANAGER" "platforms;android-37"
          "$SDKMANAGER" "build-tools;37.0.0" || "$SDKMANAGER" "build-tools;36.0.0" || true
          echo "== installed platforms =="
          ls "$ANDROID_HOME/platforms"
          echo "== installed build-tools =="
          ls "$ANDROID_HOME/build-tools" || true

      - name: Fetch prebuilt native libs (libnode etc.)
        run: |
          TAG="$(native/prebuilt.sh key)"
          echo "prebuilt tag: $TAG"
          mkdir -p /tmp/prebuilt && cd /tmp/prebuilt
          curl -fL -o "$TAG.tar.gz" "https://github.com/jackwener/DSH-Android/releases/download/$TAG/$TAG.tar.gz"
          tar -xzf "$TAG.tar.gz"
          sha256sum -c --quiet SHA256SUMS
          mkdir -p "$GITHUB_WORKSPACE/toolchains/out/jniLibs/arm64-v8a"
          cp arm64-v8a/*.so "$GITHUB_WORKSPACE/toolchains/out/jniLibs/arm64-v8a/"
          ls -la "$GITHUB_WORKSPACE/toolchains/out/jniLibs/arm64-v8a"

      - name: Build engine bundle (engine.zip)
        run: OUT_DIR="$GITHUB_WORKSPACE/toolchains/out/engine" js/build-engine.sh

      - name: Build release APK
        # No dsh.signing.* properties in CI: build.gradle.kts falls back to the
        # debug key, so the release APK is installable for UI verification.
        run: ./gradlew :app:assembleRelease -Pdsh.engineOut="$GITHUB_WORKSPACE/toolchains/out/engine" -Pdsh.nativeOut="$GITHUB_WORKSPACE/toolchains/out/jniLibs" --stacktrace

      - name: Collect APK
        run: |
          find app/build/outputs/apk -name "*.apk" -exec ls -la {} \;
          cp app/build/outputs/apk/release/app-release.apk coing.apk
          ls -la coing.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: coing-apk
          path: coing.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release (coing-v4)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view coing-v4 --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1 || \
            gh release create coing-v4 --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "coing v4" \
              --notes "GitHub Actions 构建。本版两处修正：一、对话主页空状态下输入框钉到屏幕底部，与有消息时位置一致，字标与标语在上方空间居中，切换不跳位；二、侧栏抽屉按 Miuix 列表形态重做——本机/自动化任务/权限与无障碍收进一张白色大圆角卡片、行换 Miuix preference 真组件（BasicComponent/ArrowPreference），新会话换 Miuix 主按钮，会话分节标题换 SmallTitle，会话行选中态与圆角对齐卡片内行规范，页脚登录按钮换 Miuix Button。release 未配正式 keystore、回落 debug 密钥签名，可直接覆盖安装；正式签名待定。"
          gh release upload coing-v4 coing.apk --repo "$GITHUB_REPOSITORY" --clobber
